<!DOCTYPE html>
<html style="background-color:#54b398;">
<head>
    <title>Splashes</title>
    <link rel="icon" href="Images\Splash.png">

    p {
        text-align: center;
        font-size: 30px;
        margin-top: 0px;
    }
</style>
</head>

<a href="TalismanOptimiser.html"><img src="images\Optimiser.png" style="position: absolute;;bottom:0px;left:0px;z-index:10;" width="465" height="140" /></a>
<img src="images\Splashes.png" style="position: absolute;;bottom:0px;right:0px;z-index:10;" width="465" height="140" />
<script>
if (distance < 0) {
    <p> Time until splash </p>
}
</script>
<p id="demo"></p>
<script>
var countDownDate = new Date("Apr 23 , 2020 12:00:00").getTime();

var x = setInterval(function() {

  var now = new Date().getTime();
  var distance = countDownDate - now;
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);
    
  document.getElementById("demo").innerHTML =hours + "h "
  + minutes + "m " + seconds + "s ";
    
  if (distance < 0) {
    clearInterval(x);
    document.getElementById("demo").innerHTML = "Splashing Now";
  }
  if (distance < -600) {
    clearInterval(x);  
    document.getElementById("demo").innerHTML = "You missed it, Wait for an admin to update the timer";
  }
}, 1000);
</script>

</body>
</html>
